name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  compose:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux test font
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - name: Install dependencies
        run: python -m pip install -r skills/theme-gif-stickers/requirements.txt
      - name: Verify a test font is present
        run: python -c "from pathlib import Path; assert any(Path(p).is_file() for p in ['C:/Windows/Fonts/msyhbd.ttc', 'C:/Windows/Fonts/arial.ttf', '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf']), 'Missing test font'"
      - name: Run tests
        run: python -m unittest discover -s skills/theme-gif-stickers/tests -v
